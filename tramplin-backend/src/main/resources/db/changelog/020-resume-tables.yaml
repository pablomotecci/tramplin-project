databaseChangeLog:
  - changeSet:
      id: 020-create-resume-experiences
      author: deadline_kids
      comment: "Опыт работы соискателя (раздел резюме)"
      changes:
        - createTable:
            tableName: resume_experiences
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: applicant_profile_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_resume_experiences_applicant
                    references: applicant_profiles(id)
                    deleteCascade: true
              - column:
                  name: organization
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: VARCHAR(7)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_resume_experiences_applicant
            tableName: resume_experiences
            columns:
              - column:
                  name: applicant_profile_id
              - column:
                  name: display_order

